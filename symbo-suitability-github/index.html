<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Symbo Demos</title>
  <meta name="description" content="Explore the Symbo suitability engine demonstration.">
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#00344b;background:#f7fbfa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{max-width:620px;width:100%;background:#fff;border:1px solid #e3eeeb;border-radius:16px;padding:40px;box-shadow:0 8px 30px #0a46500c}
    .brand{font-size:26px;font-weight:800;letter-spacing:.08em}.brand span{color:#00b98b}
    h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:30px 0 12px}p{color:#58717b;line-height:1.6}
    a{display:inline-block;margin-top:16px;background:#00ab80;color:white;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:8px}
    a:focus-visible{outline:3px solid #00344b;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span>SYMBO</span></div>
    <h1>See suitability in action.</h1>
    <p>Explore how customer signals become explainable recommendations, a separate customer choice, and an inspectable decision record.</p>
    <a href="/demos/suitabilityengine/">Open suitability engine demo ↗</a>
  </main>
</body>
</html>
